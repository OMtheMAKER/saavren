services:
  app:
    build: .
    # The container listens on 7860 (what Hugging Face Spaces expects);
    # on your machine it is reachable at http://localhost:8000
    ports:
      - "8000:7860"
    environment:
      # HF_TOKEN: read-only token from huggingface.co -> Settings -> Access Tokens
      # BASETEN_API_KEY: baseten.co -> API Keys
      # GROQ_API_KEY: console.groq.com -> API Keys
      # Without any of these the app still runs, the AI just answers offline.
      HF_TOKEN: ${HF_TOKEN:-}
      BASETEN_API_KEY: ${BASETEN_API_KEY:-}
      BASETEN_BASE_URL: ${BASETEN_BASE_URL:-https://inference.baseten.co/v1}
      BASETEN_MODEL: ${BASETEN_MODEL:-meta-llama/Llama-4-Maverick-17B-128E-Instruct}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      PORT: 7860
